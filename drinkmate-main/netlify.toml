[build]
  command = "npm run build"
  # Don't set publish - let the Next.js plugin handle it automatically
  functions = ".netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Harden function bundling to avoid pulling unintended transitive versions
  external_node_modules = []
  included_files = []

  [functions.node_version]
  external_node_modules = []

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Remove ALL manual redirects and headers
# The @netlify/plugin-nextjs handles:
# - Headers from next.config.mjs
# - Redirects from next.config.mjs
# - Rewrites from next.config.mjs
# - All Next.js routing automatically